<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Control WebSocket Demo</title>

<style>
body {
    font-family: Arial, Helvetica, sans-serif;
    max-width: 700px;
    margin: 40px auto;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}

input, select, textarea {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    box-sizing: border-box;
}

button {
    margin-top: 20px;
    padding: 10px 25px;
    cursor: pointer;
}

#log {
    margin-top: 30px;
    border: 1px solid #ccc;
    background: #f5f5f5;
    padding: 10px;
    height: 250px;
    overflow-y: auto;
    white-space: pre-wrap;
}
</style>

</head>
<body>

<h2>WebSocket Control Demo</h2>

<label>Call ID</label>
<input id="callid" value="">

<label>Agent ID</label>
<input id="agent" value="Richel.Carreon">

<label>Customer Information (JSON)</label>
<textarea id="customer" rows="6">
{"coeName": "CSCVIP","agentName": "Richel Carreon","agentId": "Richel.Carreon","customerName": "","uuid": "61cf8a6e-2e37-4624-8457-562a6cd36e52","callTime": "2026-06-02 09:40:15"}
</textarea>

<button id="btnAnswer">Submit ANSWER</button>
<button id="btnHangup">Submit HANGUP</button>

<div id="log"></div>

<script>

const SERVER_WS = "ws://sip-gw.croco-dial.net:9020";
const TOKEN = "cambia_esto_por_un_token_seguro";

let ws;
let pingTimer;

function log(msg){
    console.log(msg);
    document.getElementById("log").textContent += msg + "\n";
}

function conectarControl(){

    ws = new WebSocket(SERVER_WS);

    ws.onopen = () => {
        log("[CONTROL] Connected");

        pingTimer = setInterval(() => {
            if (ws.readyState === WebSocket.OPEN) {
                const payload = {
                    type: "PING",
                    token: TOKEN,
                    timestamp: Date.now()
                };
                ws.send(JSON.stringify(payload));
                log("> PING");
            }
        }, 45000);
    };

    ws.onmessage = (event) => {

        const msg = JSON.parse(event.data);

        log("< " + JSON.stringify(msg, null, 2));

        if(msg.type === "ACK"){
            log("✅ Streaming started for " + msg.callid);
        }

        if(msg.type === "ERROR"){
            log("❌ " + msg.code + " : " + msg.message);
        }

        if (msg.type === "PONG") {
            log("< PONG");
        }
    };

    ws.onclose = () => {
        log("[CONTROL] Connection closed");

        if (pingTimer) {
            clearInterval(pingTimer);
            pingTimer = null;
        }
    };

    ws.onerror = (e) => {
        log("[CONTROL] WebSocket error");
        console.error(e);
    };

}

function contestarLlamada(){

    const callid = document.getElementById("callid").value;
    const agent = document.getElementById("agent").value;

    let customerInfo;

    try{
        customerInfo = JSON.parse(document.getElementById("customer").value);
    }catch(e){
        alert("Customer Information is not valid JSON");
        return;
    }

    const payload = {
        type: "ANSWER",
        token: TOKEN,
        callid: callid,
        agent: agent,
        customer_information: customerInfo
    };

    log("> " + JSON.stringify(payload, null, 2));

    ws.send(JSON.stringify(payload));

}

function colgarLlamada(){

    const callid = document.getElementById("callid").value;

    const payload = {
        type: "HANGUP",
        token: TOKEN,
        callid: callid
    };

    log("> " + JSON.stringify(payload, null, 2));

    ws.send(JSON.stringify(payload));

}

document.getElementById("btnAnswer").onclick = contestarLlamada;
document.getElementById("btnHangup").onclick = colgarLlamada;

conectarControl();

</script>

</body>
</html>
